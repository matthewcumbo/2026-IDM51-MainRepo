<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Example | Home</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        p{
            color: blue;
        }
    </style>
</head>
<body>

    <!-- This is a comment -->
    <!-- 
        The following are heading elements, 
        of differing sizes 
    -->
    <h1 id="pageTitle" style="color:#950a0a8d;font-family:Arial, Helvetica, sans-serif;">Page Title</h1>
    <!-- 
        Attributes like the id and style can be used to alter how the element behaves.
        In this case, the id is used to create a unique element in this page which is then styled in a CSS file,
        while the style attribute is used to include inline styling to this element. 
    -->
    <h2>Subtitle</h2>
    <h3>etc</h3>
    <h4>etc...</h4>
    <h5 class="customClass">more subtitles</h5>
    <h6 class="customClass">bye</h6>
    <!-- Here the class attribute is used to apply a class which exists in our CSS file.-->

    <!-- The p element is used to create a paragraph on page.-->
    <p>This is a paragraph</p>

    <p style="color:red;">
        lorem ipsum dolor sit amet, <br> consectetur adipiscing elit.
    </p>


    <!-- The a element is used to create a link to other pages within the website -->
    <a href="2ndPage.html">Link to Page 2</a>
    
    
</body>
</html>
