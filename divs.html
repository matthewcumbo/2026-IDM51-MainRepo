<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs | Layouts</title>
    <link rel="stylesheet" href="styles/divs.css">
</head>
<body>
    <!-- 
        Divs (or divisions) are used to group together HTML elements and apply styles or layout to them. 
        They are elements that can contain other elements, such as text, images, or other divs. 
    -->
    <div class="bigBox">
        <div class="smallBox red">
            <h1>Divs</h1>
            <p>These are some divs.</p>
        </div>

        <div class="smallBox blue">
            <h1>Second Box</h1>
            <p>lorem ipsum dolor sit amet</p>
        </div>


    </div>

</body>
</html>
