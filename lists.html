<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lists</h1>

    <!-- 
        UL = Unordered List (bulleted list)
        OL = Ordered List (numbered list)
        LI = List Item

        Lists are built using LIs for each line within the list
    -->

    <h2>Shopping List</h2>
    <ul>
        <li>Milk</li>
        <li>Cereal</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ul>

    <h2>Top 5 Games</h2>
    <ol>
        <li>Baldur's Gate 3</li>
        <li>Cyberpunk 2077</li>
        <li>Red Dead Redemption 2</li>
        <li>Skyrim</li>
        <li>Kingdom Come Deliverance 2</li>
    </ol>

</body>
</html>
