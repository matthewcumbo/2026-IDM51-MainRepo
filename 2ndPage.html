<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Example | Page 2</title>
    <!-- 
        The link element in the head is used to link to a CSS file to allow us to have a more organised project.
        HTML files should have only HTML, while CSS should be in CSS files. 
    -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- An id cannot be used multiple times in the same HTML document, but can be used in different pages, allowing us to use the same styling for elements with the same id -->
    <h1 id="pageTitle">Page 2</h1>

    <p>This is a paragraph on Page 2</p>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequuntur reiciendis culpa totam doloribus ipsam sint architecto impedit placeat illum voluptatibus, eum expedita eveniet officiis sed quam voluptatum doloremque fugiat esse.</p>
</body>
</html>
