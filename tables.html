<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="styles/tables.css">
</head>
<body>
    <h1>Tables</h1>

    <!-- 
        Tables are used to create grids.
        
        TABLE = the containing box
        TR = Table row
        TD = Table data (cell)
    -->
    <table>
        <tr>
            <th>
                First Name
            </th>
            <th>
                Last Name
            </th>
        </tr>
        <tr>
            <td>
                Joe
            </td>
            <td>
                Borg
            </td>
        </tr>
        <tr>
            <td>
                Jane
            </td>
            <td>
                Doe
            </td>
        </tr>
    </table>
</body>
</html>
